<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zakelijk Nederlands — Dutch Business Chat Tutor (single file)</title>
<script>
window.onerror = function (msg, src, line) {
  var box = document.getElementById("fatal-error");
  if (box) {
    box.style.display = "block";
    box.textContent = "Error: " + msg + " (" + (src || "") + ":" + line + ")";
  }
  return false;
};
setTimeout(function () {
  var list = document.getElementById("scenario-list");
  var box = document.getElementById("fatal-error");
  if (list && list.children.length === 0 && box) {
    box.style.display = "block";
    box.textContent = "The app could not start: its script files did not load. Make sure index.html, styles.css and the js folder were all extracted together into the same folder — or open standalone.html, which works as a single file.";
  }
}, 1500);
</script>
<style>
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #1c2536;
  --muted: #6b7688;
  --accent: #0e6e5c;
  --accent-dark: #0a5044;
  --accent-soft: #e2f2ee;
  --line: #dfe4ec;
  --warn: #b3541e;
  --bot-bg: #ffffff;
  --user-bg: #0e6e5c;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(28, 37, 54, 0.08), 0 8px 24px rgba(28, 37, 54, 0.06);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 18px 28px;
  background: linear-gradient(135deg, #0a5044, #0e6e5c 60%, #12806b);
  color: #fff;
}

.brand { display: flex; align-items: center; gap: 14px; }
.brand .flag { font-size: 34px; }
.brand h1 { margin: 0; font-size: 22px; letter-spacing: 0.2px; }
.tagline { margin: 2px 0 0; font-size: 13px; opacity: 0.85; }

.stats { display: flex; align-items: center; gap: 18px; }
.stat { text-align: center; min-width: 52px; }
.stat-num { display: block; font-size: 20px; font-weight: 700; }
.stat-label { font-size: 11px; opacity: 0.85; }

.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }

.tabs {
  display: flex;
  gap: 6px;
  padding: 10px 28px 0;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.tab {
  border: none;
  background: transparent;
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  border-radius: 8px 8px 0 0;
  cursor: pointer;
}

.tab.active { color: var(--accent); background: var(--accent-soft); }

main { max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }

.view { display: none; }
.view.active { display: block; }
.hidden { display: none !important; }

h2 { font-size: 20px; margin: 8px 0 6px; }
h3 { font-size: 16px; margin: 26px 0 10px; }
.muted { color: var(--muted); font-size: 13px; }

.scenario-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.scenario-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.12s ease, border-color 0.12s ease;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scenario-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.scenario-card .icon { font-size: 26px; }
.scenario-card h3 { margin: 0; font-size: 16px; }
.scenario-card p { margin: 0; font-size: 13px; color: var(--muted); }

.chip {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent-dark);
  font-size: 12px;
  font-weight: 700;
}

.chip.done { background: #e7f0e2; color: #3c6e26; }
.chip.warn { background: #fbeadf; color: var(--warn); }

.scenario-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.scenario-title { display: flex; align-items: center; gap: 10px; }
.step-dots { display: flex; gap: 6px; }
.step-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.step-dots span.done { background: var(--accent); }
.step-dots span.current { background: var(--warn); }

.tips-box {
  background: #fdf8ef;
  border: 1px solid #eedfbf;
  border-radius: var(--radius);
  padding: 12px 16px;
  margin: 14px 0;
  font-size: 13.5px;
}
.tips-box strong { display: block; margin-bottom: 4px; }
.tips-box ul { margin: 0; padding-left: 18px; }

.chat-window {
  background: #eef1f6;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  height: 420px;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.45; box-shadow: var(--shadow); }
.msg.bot { background: var(--bot-bg); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.user { background: var(--user-bg); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.coach { background: #fff7ed; border: 1px solid #f5ddba; color: #7c4a12; align-self: flex-start; max-width: 92%; font-size: 13.5px; }
.msg .nl { font-weight: 600; }
.msg .nl-block { display: block; }
.msg .en-block { display: block; margin-top: 4px; font-size: 13px; opacity: 0.75; font-weight: 400; }
.msg.user .en-block { opacity: 0.8; }
.msg.coach .label { display: block; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.6px; margin-bottom: 3px; }
.msg.typing { opacity: 0.6; font-style: italic; }

.composer { display: flex; gap: 8px; margin-top: 14px; }
#chat-input {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 15px;
  font-family: inherit;
}
#chat-input:focus { outline: 2px solid var(--accent); border-color: transparent; }

.btn {
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.small { padding: 4px 10px; font-size: 12px; }

.composer-foot { min-height: 20px; margin-top: 6px; font-size: 13px; color: var(--muted); }
#coach-note.good { color: var(--accent); }
#coach-note.warn { color: var(--warn); }

.vocab-controls { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.vocab-buttons { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vocab-buttons select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 13px; }

.review-panel { margin: 18px 0; }
.flashcard {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
  text-align: center;
}
.card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.card-word { font-size: 28px; font-weight: 700; margin: 18px 0; }
.card-answer { font-size: 18px; color: var(--accent-dark); margin-bottom: 14px; }
.card-actions { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.grade-row { display: flex; gap: 8px; }
.btn.grade.again { border-color: #d8a29a; color: #a83a2c; }
.btn.grade.hard { border-color: #e0bd8a; color: #94601a; }
.btn.grade.good { border-color: #9fc6a4; color: #2f7a3a; }
.btn.grade.easy { border-color: #9ab7d8; color: #2b5fa3; }

.vocab-table { margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.vocab-item {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 14px;
}
.vocab-item .nl-word { font-weight: 700; }
.vocab-item .en-word { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.vocab-item .meta { display: flex; gap: 6px; margin-top: 6px; }
.vocab-item .box-chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); }

.grammar-list { display: grid; gap: 12px; }
.grammar-item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.grammar-item h4 { margin: 0 0 6px; font-size: 15px; }
.grammar-item p { margin: 0; font-size: 14px; line-height: 1.55; color: #33405a; }

.progress-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.progress-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.progress-card .big { font-size: 26px; font-weight: 800; color: var(--accent-dark); }
.progress-card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.progress-scenarios { display: grid; gap: 10px; }
.progress-row { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.progress-row .name { flex: 1; font-size: 14px; font-weight: 600; }
.progress-bar { width: 180px; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress-bar i { display: block; height: 100%; background: var(--accent); }

.foot { text-align: center; color: var(--muted); font-size: 12.5px; padding: 20px; }

.fatal-error {
  display: none;
  margin: 16px auto 0;
  max-width: 720px;
  background: #fbe3e0;
  border: 1px solid #e5a49d;
  color: #8c2f24;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 14px;
  text-align: left;
}

.storage-warning {
  margin: 0 auto 10px;
  max-width: 640px;
  background: #fbeadf;
  border: 1px solid #ecc7a8;
  color: var(--warn);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13px;
  text-align: left;
}

@media (max-width: 640px) {
  .topbar { padding: 14px 16px; }
  .tabs { padding: 8px 12px 0; }
  .chat-window { height: 340px; }
  .progress-bar { width: 100px; }
}

</style>
</head>
<body>
<div id="fatal-error" class="fatal-error" style="display:none"></div>
<noscript><div class="fatal-error">This app needs JavaScript enabled.</div></noscript>
<header class="topbar">
  <div class="brand">
    <span class="flag">🇳🇱</span>
    <div>
      <h1>Zakelijk Nederlands</h1>
      <p class="tagline">Dutch to business level, one conversation at a time</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat" title="Experience points"><span class="stat-num" id="stat-xp">0</span><span class="stat-label">XP</span></div>
    <div class="stat" title="Day streak"><span class="stat-num" id="stat-streak">1</span><span class="stat-label">🔥</span></div>
    <label class="toggle">
      <input type="checkbox" id="toggle-translations" checked />
      <span>EN translations</span>
    </label>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="lessons">💬 Lessons</button>
  <button class="tab" data-view="vocab">🗂️ Vocabulary</button>
  <button class="tab" data-view="grammar">📖 Grammar</button>
  <button class="tab" data-view="progress">📈 Progress</button>
</nav>

<main id="main">

  <section id="view-lessons" class="view active">
    <div id="scenario-list" class="scenario-list"></div>

    <div id="scenario-view" class="scenario-view hidden">
      <div class="scenario-header">
        <button class="btn ghost" id="btn-back">← All scenarios</button>
        <div class="scenario-title">
          <h2 id="scenario-heading"></h2>
          <span class="chip" id="scenario-level"></span>
        </div>
        <div class="step-dots" id="step-dots"></div>
      </div>
      <div class="tips-box" id="tips-box"></div>
      <div class="chat-window" id="chat-window"></div>
      <div class="composer">
        <input type="text" id="chat-input" placeholder="Schrijf je antwoord in het Nederlands…" autocomplete="off" />
        <button class="btn primary" id="btn-send">Send</button>
        <button class="btn ghost" id="btn-hint" title="Get a hint">Hint</button>
        <button class="btn ghost" id="btn-show-answer" title="Reveal a model answer">Show answer</button>
      </div>
      <div class="composer-foot">
        <span id="coach-note"></span>
      </div>
    </div>
  </section>

  <section id="view-vocab" class="view">
    <div class="vocab-controls">
      <div>
        <h2>Business vocabulary</h2>
        <p class="muted" id="vocab-summary"></p>
      </div>
      <div class="vocab-buttons">
        <select id="vocab-filter-module"></select>
        <select id="vocab-filter-level">
          <option value="all">All levels</option>
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
          <option value="C1">C1</option>
        </select>
        <button class="btn primary" id="btn-review">Review session</button>
      </div>
    </div>
    <div id="review-panel" class="review-panel hidden">
      <div class="flashcard" id="flashcard">
        <div class="card-top"><span id="review-progress" class="muted"></span><button class="btn ghost small" id="btn-end-review">End</button></div>
        <div class="card-word" id="card-nl"></div>
        <div class="card-answer hidden" id="card-en"></div>
        <div class="card-actions">
          <button class="btn ghost" id="btn-reveal">Show meaning</button>
          <div class="grade-row hidden" id="grade-row">
            <button class="btn grade again" data-grade="again">Again</button>
            <button class="btn grade hard" data-grade="hard">Hard</button>
            <button class="btn grade good" data-grade="good">Good</button>
            <button class="btn grade easy" data-grade="easy">Easy</button>
          </div>
        </div>
      </div>
    </div>
    <div id="vocab-table" class="vocab-table"></div>
  </section>

  <section id="view-grammar" class="view">
    <h2>Grammar essentials for business Dutch</h2>
    <div id="grammar-list" class="grammar-list"></div>
  </section>

  <section id="view-progress" class="view">
    <h2>Your progress</h2>
    <div class="progress-cards" id="progress-cards"></div>
    <h3>Scenario completion</h3>
    <div id="progress-scenarios" class="progress-scenarios"></div>
  </section>

</main>

<footer class="foot">
  Data stays in your browser (localStorage). Reach for 10 minutes a day — consistency beats cramming.
</footer>

        ]
      },
      {
        bot: "Tot slot: hoe sluit u de presentatie af en nodigt u uit tot vragen?",
        en: "Finally: how do you close the presentation and invite questions?",
        hint: "Summarize and invite: 'Ik sluit af met een samenvatting: ... Zijn er nog vragen?'",
        nudge: "End with 'Zijn er nog vragen?' or 'Als er vragen zijn, hoor ik die graag.'",
        accept: [

        ]
      }
    ]
  }
];

const GRAMMAR_TOPICS = [
  {
    title: "V2 word order (main clauses)",
    level: "A2",
    body: "In a Dutch main clause the conjugated verb is always the second element. 'Vandaag bespreek ik de jaarresultaten.' — 'Vandaag' is first, so the verb comes immediately after, before 'ik'."
  },
  {
    title: "Verb-final after 'omdat', 'om ... te', 'mits'",
    level: "B1",
    body: "Subordinating conjunctions push the verb to the end: 'Ik bel omdat ik een afspraak wil maken.' 'Ik stel voor om de deadline te verlengen.' 'Akkoord, mits de betaling binnen 30 dagen gebeurt.'"
  },
  {
    title: "'u' vs 'je'",
    level: "A2",
    body: "Use 'u' in formal business contact: 'Zou u de agenda kunnen bevestigen?' Switch to 'je' only when the other person proposes it ('Zullen we jou zeggen?')."
  },
  {
    title: "Modal verbs in the past",
    level: "B1",
    body: "'We konden de deadline niet halen.' With a second verb the perfect uses a double infinitive: 'We hebben de deadline niet kunnen halen.' (not 'gekannd')"
  },
  {
    title: "Polite questions with 'zou'",
    level: "B2",
    body: "'Zou u ... kunnen ...?' is the most polite form: 'Zou u het rapport kunnen toesturen?' Softer than 'Kunt u ...?' — standard in business email."
  }
];

;
const STORE_KEY = "zakelijknl_v1";

function normalize(text) {
  return text
    .toLowerCase()
    .replace(/[.,!?;:«»"“”'’()]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function prepPattern(pattern) {
  return pattern
    .replace(/[.,!?;:«»“”'’()]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function wildcardRegex(pattern) {
  const escaped = prepPattern(pattern)
    .replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
    .replace(/\\\{[^}]*\\\}/g, ".+");
  return new RegExp("^" + escaped + "$", "i");
}

function similarity(a, b) {
  const s1 = " " + a + " ";
  const s2 = " " + b + " ";
  const m = s1.length;
  const n = s2.length;
  if (m === 0 || n === 0) return 0;
  let prev = new Array(n + 1);
  let curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
    }
    [prev, curr] = [curr, prev];
  }
  return 1 - prev[n] / Math.max(m, n);
}

function matchStep(input, accept) {
  const normalized = normalize(input);
  if (!normalized) return { verdict: "empty" };
  for (const pattern of accept) {
    if (wildcardRegex(pattern).test(normalized)) {
      return { verdict: "exact", pattern };
    }
  }
  let best = 0;
  let bestPattern = null;
  for (const pattern of accept) {
    const filled = pattern.replace(/\{[^}]+\}/g, "iets");
    const score = similarity(normalized, normalize(filled));
    if (score > best) {
      best = score;
      bestPattern = pattern;
    }
  }
  if (best >= 0.82) return { verdict: "near", score: best, pattern: bestPattern };
  if (best >= 0.55) return { verdict: "close", score: best, pattern: bestPattern };
  return { verdict: "off", score: best };
}

function defaultState() {
  return {
    xp: 0,
    streak: 1,
    lastStudy: null,
    completedSteps: {},
    srs: {},
    scenarioDone: {},
    translations: true
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  } catch (e) {
    return defaultState();
  }
}

let storageAvailable = storageOk();

function saveState() {
  if (!storageAvailable) return;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    storageAvailable = false;
  }
}

function storageOk() {
  try {
    const probe = "__zn_probe__";
    localStorage.setItem(probe, "1");
    localStorage.removeItem(probe);
    return true;
  } catch (e) {
    return false;
  }
}

;
const state = loadState();
let currentScenario = null;
let currentStepIndex = 0;
let attempts = 0;
let answeredThisStep = false;
let reviewQueue = [];
let reviewIndex = 0;
let revealed = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function touchStreak() {
  const today = todayKey();
  if (state.lastStudy === today) return;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  state.streak = state.lastStudy === yesterday ? state.streak + 1 : 1;
  state.lastStudy = today;
  saveState();
  renderStats();
}

function addXp(n) {
  state.xp += n;
  saveState();
  renderStats();
}

function stepKey(scenarioId, index) {
  return scenarioId + ":" + index;
}

function scenarioProgress(scenario) {
  let done = 0;
  scenario.steps.forEach((_, i) => {
    if (state.completedSteps[stepKey(scenario.id, i)]) done++;
  });
  return done;
}

function renderStats() {
  $("stat-xp").textContent = state.xp;
  $("stat-streak").textContent = state.streak;
  $("toggle-translations").checked = state.translations;
}

function addMessage(kind, nlHtml, enText) {
  const el = document.createElement("div");
  el.className = "msg " + kind;
  let html = "";
  if (kind === "coach") {
    html = '<span class="label">Coach</span>' + nlHtml;
  } else {
    html = '<span class="nl-block">' + nlHtml + "</span>";
    if (enText && state.translations) {
      html += '<span class="en-block">' + esc(enText) + "</span>";
    }
  }
  el.innerHTML = html;
  $("chat-window").appendChild(el);
  $("chat-window").scrollTop = $("chat-window").scrollHeight;
  return el;
}

function renderScenarioList() {
  const wrap = $("scenario-list");
  wrap.innerHTML = "";
  SCENARIOS.forEach((s) => {
    const done = scenarioProgress(s);
    const total = s.steps.length;
    const card = document.createElement("div");
    card.className = "scenario-card";
    card.innerHTML =
      '<span class="icon">' + s.icon + "</span>" +
      "<h3>" + esc(s.title) + "</h3>" +
      '<p>' + esc(s.blurb) + "</p>" +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:4px;">' +
      '<span class="chip">' + s.level + "</span>" +
      (done === total ? '<span class="chip done">✓ Completed</span>' : '<span class="chip warn">' + done + "/" + total + " steps</span>") +
      "</div>";
    card.addEventListener("click", () => openScenario(s.id));
    wrap.appendChild(card);
  });
}

function openScenario(id) {
  currentScenario = SCENARIOS.find((s) => s.id === id);
  currentStepIndex = 0;
  $("scenario-list").classList.add("hidden");
  $("scenario-view").classList.remove("hidden");
  $("scenario-heading").textContent = currentScenario.icon + " " + currentScenario.title;
  $("scenario-level").textContent = currentScenario.level + " · " + currentScenario.titleEn;
  const tips = currentScenario.tips.map((t) => "<li>" + esc(t) + "</li>").join("");
  $("tips-box").innerHTML = "<strong>Before you start</strong><ul>" + tips + "</ul>";
  $("chat-window").innerHTML = "";
  attempts = 0;
  answeredThisStep = false;
  renderDots();
  addMessage("bot", esc(currentScenario.steps[0].bot), currentScenario.steps[0].en);
  $("chat-input").focus();
}

function closeScenario() {
  currentScenario = null;
  $("scenario-view").classList.add("hidden");
  $("scenario-list").classList.remove("hidden");
  renderScenarioList();
  renderProgress();
}

function renderDots() {
  const dots = $("step-dots");
  dots.innerHTML = "";
  currentScenario.steps.forEach((_, i) => {
    const span = document.createElement("span");
    if (state.completedSteps[stepKey(currentScenario.id, i)]) span.className = "done";
    else if (i === currentStepIndex) span.className = "current";
    dots.appendChild(span);
  });
}

function handleSend() {
  const input = $("chat-input");
  const text = input.value.trim();
  if (!text || !currentScenario) return;
  input.value = "";
  const showEn = state.translations;
  addMessage("user", esc(text), null);
  touchStreak();

  const step = currentScenario.steps[currentStepIndex];
  const result = matchStep(text, step.accept);

  if (result.verdict === "empty") return;

  if (result.verdict === "exact" || result.verdict === "near") {
    const xp = (result.verdict === "exact" && attempts === 0 ? 15 : 10);
    addXp(xp);
    state.completedSteps[stepKey(currentScenario.id, currentStepIndex)] = true;
    saveState();
    attempts = 0;
    answeredThisStep = true;
    addMessage("coach", xpNote(result.verdict, xp), null);
    renderDots();
    if (currentStepIndex < currentScenario.steps.length - 1) {
      currentStepIndex++;
      setTimeout(() => {
        const next = currentScenario.steps[currentStepIndex];
        addMessage("bot", esc(next.bot), next.en);
        renderDots();
        $("coach-note").textContent = "";
        answeredThisStep = false;
      }, 700);
    } else {
      const allDone = scenarioProgress(currentScenario) === currentScenario.steps.length;
      setTimeout(() => {
        addMessage("coach", "🎉 <strong>Scenario voltooid!</strong> You completed <strong>" + esc(currentScenario.titleEn) + "</strong>." + (allDone ? " This scenario is now fully mastered — try the next one." : ""), null);
        renderDots();
        answeredThisStep = false;
      }, 700);
    }
    return;
  }

  attempts++;
  if (result.verdict === "close") {
    addMessage("coach", "Almost! Small differences from a natural phrasing. " + esc(step.hint), null);
    setNote("Keep going — you're close.", "warn");
  } else if (attempts === 1) {
    addMessage("coach", esc(step.hint), null);
    setNote("Attempt 1 — try again with the hint above.", "warn");
  } else if (attempts === 2) {
    addMessage("coach", esc(step.nudge), null);
    setNote("Attempt 2 — focus on the structure in the hint.", "warn");
  } else {
    const model = step.accept[0];
    addMessage("coach", "A natural way to say it: <strong>" + esc(model) + "</strong><br>Type it (or your own version) to continue.", null);
    setNote("Model answer revealed — retype to advance.", "warn");
  }
}

function xpNote(verdict, xp) {
  if (verdict === "exact") return "✅ <strong>Goed gedaan!</strong> Natural phrasing. +" + xp + " XP";
  return "✅ <strong>Goed gedaan!</strong> Understood — a native might phrase it slightly differently. +" + xp + " XP";
}

function setNote(text, cls) {
  const note = $("coach-note");
  note.textContent = text;
  note.className = cls || "";
}

function handleHint() {
  if (!currentScenario) return;
  const step = currentScenario.steps[currentStepIndex];
  addMessage("coach", "💡 " + esc(step.hint), null);
}

function handleShowAnswer() {
  if (!currentScenario) return;
  const step = currentScenario.steps[currentStepIndex];
  addMessage("coach", "Model answer: <strong>" + esc(step.accept[0]) + "</strong>", null);
  setNote("Type a similar sentence to continue.", "");
}

function renderVocabFilters() {
  const sel = $("vocab-filter-module");
  sel.innerHTML = '<option value="all">All topics</option>';
  SCENARIOS.forEach((s) => {
    const opt = document.createElement("option");
    opt.value = s.id;
    opt.textContent = s.title;
    sel.appendChild(opt);
  });
}

function dueCards() {
  const now = Date.now();
  return VOCAB.filter((v) => {
    const rec = state.srs[v.nl];
    if (!rec) return true;
    return rec.due <= now;
  });
}

function renderVocab() {
  const mod = $("vocab-filter-module").value;
  const lvl = $("vocab-filter-level").value;
  const wrap = $("vocab-table");
  wrap.innerHTML = "";
  const filtered = VOCAB.filter(
    (v) => (mod === "all" || v.module === mod) && (lvl === "all" || v.level === lvl)
  );
  filtered.forEach((v) => {
    const rec = state.srs[v.nl];
    const box = rec ? rec.box + 1 : 0;
    const item = document.createElement("div");
    item.className = "vocab-item";
    item.innerHTML =
      '<span class="nl-word">' + esc(v.nl) + "</span>" +
      '<span class="en-word">' + esc(v.en) + "</span>" +
      '<div class="meta"><span class="box-chip">' + v.level + '</span><span class="box-chip">box ' + box + "</span></div>";
    wrap.appendChild(item);
  });
  const due = dueCards().length;
  $("vocab-summary").textContent = VOCAB.length + " words · " + due + " due for review" + (due ? " — keep the streak alive" : "");
}

const INTERVALS_DAYS = [0, 1, 3, 7, 16, 35];

function gradeCard(grade) {
  const card = reviewQueue[reviewIndex];
  if (!card) return;
  const rec = state.srs[card.nl] || { box: 0, due: 0 };
  if (grade === "again") {
    rec.box = 0;
    rec.due = Date.now() + 60000;
  } else {
    const bump = grade === "hard" ? 0 : grade === "easy" ? 2 : 1;
    rec.box = Math.min(rec.box + 1 + bump, INTERVALS_DAYS.length - 1);
    rec.due = Date.now() + INTERVALS_DAYS[rec.box] * 86400000;
  }
  state.srs[card.nl] = rec;
  addXp(2);
  touchStreak();
  reviewIndex++;
  showCard();
}

function startReview() {
  reviewQueue = dueCards();
  if (reviewQueue.length === 0) {
    reviewQueue = VOCAB.slice();
  }
  reviewQueue.sort(() => Math.random() - 0.5);
  reviewIndex = 0;
  $("review-panel").classList.remove("hidden");
  showCard();
}

function showCard() {
  if (reviewIndex >= reviewQueue.length) {
    $("card-nl").textContent = "Review session complete! 🎉";
    $("card-en").classList.add("hidden");
    $("btn-reveal").classList.add("hidden");
    $("grade-row").classList.add("hidden");
    $("review-progress").textContent = "";
    renderVocab();
    return;
  }
  const card = reviewQueue[reviewIndex];
  revealed = false;
  $("review-progress").textContent = (reviewIndex + 1) + " / " + reviewQueue.length;
  $("card-nl").textContent = card.nl;
  $("card-en").textContent = card.en;
  $("card-en").classList.add("hidden");
  $("btn-reveal").classList.remove("hidden");
  $("grade-row").classList.add("hidden");
}

function revealCard() {
  if (reviewIndex >= reviewQueue.length) return;
  revealed = true;
  $("card-en").classList.remove("hidden");
  $("btn-reveal").classList.add("hidden");
  $("grade-row").classList.remove("hidden");
}

function endReview() {
  $("review-panel").classList.add("hidden");
  renderVocab();
}

function renderGrammar() {
  const wrap = $("grammar-list");
  wrap.innerHTML = "";
  GRAMMAR_TOPICS.forEach((g) => {
    const el = document.createElement("div");
    el.className = "grammar-item";
    el.innerHTML = '<h4><span class="chip">' + g.level + "</span> " + esc(g.title) + "</h4><p>" + esc(g.body) + "</p>";
    wrap.appendChild(el);
  });
}

function renderProgress() {
  const cards = $("progress-cards");
  const totalSteps = SCENARIOS.reduce((n, s) => n + s.steps.length, 0);
  const doneSteps = Object.keys(state.completedSteps).length;
  const mastered = Object.values(state.srs).filter((r) => r.box >= 4).length;
  cards.innerHTML = "";
  [
    { big: state.xp, lbl: "Total XP" },
    { big: state.streak + "🔥", lbl: "Day streak" },
    { big: doneSteps + "/" + totalSteps, lbl: "Dialogue steps" },
    { big: mastered, lbl: "Words mastered" }
  ].forEach((c) => {
    const el = document.createElement("div");
    el.className = "progress-card";
    el.innerHTML = '<div class="big">' + c.big + '</div><div class="lbl">' + c.lbl + "</div>";
    cards.appendChild(el);
  });

  const rows = $("progress-scenarios");
  rows.innerHTML = "";
  SCENARIOS.forEach((s) => {
    const done = scenarioProgress(s);
    const pct = Math.round((done / s.steps.length) * 100);
    const row = document.createElement("div");
    row.className = "progress-row";
    row.innerHTML =
      '<span>' + s.icon + '</span><span class="name">' + esc(s.title) + '</span>' +
      '<div class="progress-bar"><i style="width:' + pct + '%"></i></div>' +
      '<span class="muted">' + done + "/" + s.steps.length + "</span>";
    rows.appendChild(row);
  });
}

document.querySelectorAll(".tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
    document.querySelectorAll(".view").forEach((v) => v.classList.remove("active"));
    tab.classList.add("active");
    $("view-" + tab.dataset.view).classList.add("active");
    if (tab.dataset.view === "vocab") renderVocab();
    if (tab.dataset.view === "progress") renderProgress();
  });
});

$("btn-back").addEventListener("click", closeScenario);
$("btn-send").addEventListener("click", handleSend);
$("btn-hint").addEventListener("click", handleHint);
$("btn-show-answer").addEventListener("click", handleShowAnswer);
$("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleSend();
});
$("toggle-translations").addEventListener("change", (e) => {
  state.translations = e.target.checked;
  saveState();
});
$("btn-review").addEventListener("click", startReview);
$("btn-end-review").addEventListener("click", endReview);
$("btn-reveal").addEventListener("click", revealCard);
document.querySelectorAll(".btn.grade").forEach((b) => {
  b.addEventListener("click", () => gradeCard(b.dataset.grade));
});
$("vocab-filter-module").addEventListener("change", renderVocab);
$("vocab-filter-level").addEventListener("change", renderVocab);

if (!storageAvailable) {
  const warn = document.createElement("div");
  warn.className = "storage-warning";
  warn.textContent = "⚠️ Browser storage is blocked, so your progress will not be saved between sessions. The app still works — but enable site data/cookies or leave private browsing to keep your progress.";
  document.querySelector("footer").prepend(warn);
}

renderStats();
renderScenarioList();
renderVocabFilters();
renderGrammar();
renderVocab();
renderProgress();

</script>
