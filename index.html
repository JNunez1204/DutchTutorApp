<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zakelijk Nederlands — Dutch Business Chat Tutor</title>
<script>
window.onerror = function (msg, src, line) {
  var box = document.getElementById("fatal-error");
  if (box) {
    box.style.display = "block";
    box.textContent = "Error: " + msg + " (" + (src || "") + ":" + line + ")";
  }
  return false;
};
setTimeout(function () {
  var list = document.getElementById("scenario-list");
  var box = document.getElementById("fatal-error");
  if (list && list.children.length === 0 && box) {
    box.style.display = "block";
    box.textContent = "The app could not start: its script files did not load. Make sure index.html, styles.css and the js folder were all extracted together into the same folder — or open standalone.html, which works as a single file.";
  }
}, 1500);
</script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="fatal-error" class="fatal-error" style="display:none"></div>
<noscript><div class="fatal-error">This app needs JavaScript enabled.</div></noscript>
<header class="topbar">
  <div class="brand">
    <span class="flag">🇳🇱</span>
    <div>
      <h1>Zakelijk Nederlands</h1>
      <p class="tagline">Dutch to business level, one conversation at a time</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat" title="Experience points"><span class="stat-num" id="stat-xp">0</span><span class="stat-label">XP</span></div>
    <div class="stat" title="Day streak"><span class="stat-num" id="stat-streak">1</span><span class="stat-label">🔥</span></div>
    <label class="toggle">
      <input type="checkbox" id="toggle-translations" checked />
      <span>EN translations</span>
    </label>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-view="lessons">💬 Lessons</button>
  <button class="tab" data-view="vocab">🗂️ Vocabulary</button>
  <button class="tab" data-view="grammar">📖 Grammar</button>
  <button class="tab" data-view="progress">📈 Progress</button>
</nav>

<main id="main">

  <section id="view-lessons" class="view active">
    <div id="scenario-list" class="scenario-list"></div>

    <div id="scenario-view" class="scenario-view hidden">
      <div class="scenario-header">
        <button class="btn ghost" id="btn-back">← All scenarios</button>
        <div class="scenario-title">
          <h2 id="scenario-heading"></h2>
          <span class="chip" id="scenario-level"></span>
        </div>
        <div class="step-dots" id="step-dots"></div>
      </div>
      <div class="tips-box" id="tips-box"></div>
      <div class="chat-window" id="chat-window"></div>
      <div class="composer">
        <input type="text" id="chat-input" placeholder="Schrijf je antwoord in het Nederlands…" autocomplete="off" />
        <button class="btn primary" id="btn-send">Send</button>
        <button class="btn ghost" id="btn-hint" title="Get a hint">Hint</button>
        <button class="btn ghost" id="btn-show-answer" title="Reveal a model answer">Show answer</button>
      </div>
      <div class="composer-foot">
        <span id="coach-note"></span>
      </div>
    </div>
  </section>

  <section id="view-vocab" class="view">
    <div class="vocab-controls">
      <div>
        <h2>Business vocabulary</h2>
        <p class="muted" id="vocab-summary"></p>
      </div>
      <div class="vocab-buttons">
        <select id="vocab-filter-module"></select>
        <select id="vocab-filter-level">
          <option value="all">All levels</option>
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="B1">B1</option>
          <option value="B2">B2</option>
          <option value="C1">C1</option>
        </select>
        <button class="btn primary" id="btn-review">Review session</button>
      </div>
    </div>
    <div id="review-panel" class="review-panel hidden">
      <div class="flashcard" id="flashcard">
        <div class="card-top"><span id="review-progress" class="muted"></span><button class="btn ghost small" id="btn-end-review">End</button></div>
        <div class="card-word" id="card-nl"></div>
        <div class="card-answer hidden" id="card-en"></div>
        <div class="card-actions">
          <button class="btn ghost" id="btn-reveal">Show meaning</button>
          <div class="grade-row hidden" id="grade-row">
            <button class="btn grade again" data-grade="again">Again</button>
            <button class="btn grade hard" data-grade="hard">Hard</button>
            <button class="btn grade good" data-grade="good">Good</button>
            <button class="btn grade easy" data-grade="easy">Easy</button>
          </div>
        </div>
      </div>
    </div>
    <div id="vocab-table" class="vocab-table"></div>
  </section>

  <section id="view-grammar" class="view">
    <h2>Grammar essentials for business Dutch</h2>
    <div id="grammar-list" class="grammar-list"></div>
  </section>

  <section id="view-progress" class="view">
    <h2>Your progress</h2>
    <div class="progress-cards" id="progress-cards"></div>
    <h3>Scenario completion</h3>
    <div id="progress-scenarios" class="progress-scenarios"></div>
  </section>

</main>

<footer class="foot">
  Data stays in your browser (localStorage). Reach for 10 minutes a day — consistency beats cramming.
</footer>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
